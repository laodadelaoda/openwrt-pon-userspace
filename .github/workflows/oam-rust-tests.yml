name: OAM Rust tests

on:
  push:
    paths:
      - "airoha-pon-daemons/src/**"
      - ".github/workflows/oam-rust-tests.yml"
  pull_request:
    paths:
      - "airoha-pon-daemons/src/**"
      - ".github/workflows/oam-rust-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-test:
    name: Cargo unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run daemon crate tests
        run: cargo test --locked --manifest-path airoha-pon-daemons/src/Cargo.toml
